apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bilalwaheed24/gitops-platform
    targetRevision: HEAD
    path: gitops/workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
