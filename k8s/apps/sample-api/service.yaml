apiVersion: v1
kind: Service
metadata:
  name: sample-api
  namespace: production
spec:
  selector:
    app: sample-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-canary
  namespace: production
spec:
  selector:
    app: sample-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
