apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sample-api
  namespace: production
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sample-api
  template:
    metadata:
      labels:
        app: sample-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Hello from GitOps Platform v2.0.0 — CANARY"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
  strategy:
    canary:
      canaryService: sample-api-canary
      stableService: sample-api
      steps:
        - setWeight: 50
        - pause: {duration: "30s"}
        - setWeight: 100
